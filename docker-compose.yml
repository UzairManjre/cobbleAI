version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: cobble-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cobble-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  qdrant:
    # Hybrid (dense + BM25) retrieval needs Qdrant >= v1.10 for sparse vectors with the IDF modifier.
    # Pinned (verified with CobbleAI 2.0) so upgrades are deliberate.
    image: qdrant/qdrant:v1.20.0
    container_name: cobble-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  minio:
    # minio/minio was removed from Docker Hub in September 2026; Chainguard publishes the same server binary.
    image: cgr.dev/chainguard/minio:latest
    container_name: cobble-minio
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=cobble_secure_minio_pass
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  qdrant_data:
  minio_data:
